<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title description">
  <title id="title">Frontend, Agent Harness, and native tool runner</title>
  <desc id="description">The frontend can be hosted on the server or client machine and calls Harness APIs. The client SDK hosts scenario-specific tools and connects to the Harness through outbound HTTP long polling. Only file-based scenarios need a workspace. The server manages the model, agent loop, database, skills, and virtual files. Tool code stays on the device; every connection to a device is initiated by that device.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4763cb"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 1.3px; }
      .heading { font-size: 25px; font-weight: 700; fill: #17243b; }
      .body { font-size: 18px; fill: #475569; }
      .flow { font-size: 17px; font-weight: 600; fill: #344ca2; }
      .arrow { fill: none; stroke: #4763cb; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="640" rx="16" fill="#ffffff"/>
  <rect x="24" y="24" width="380" height="236" rx="16" fill="#fff8ed" stroke="#edd2a5"/>
  <text x="48" y="62" class="label" fill="#936219">FRONTEND / HOST ANYWHERE</text>
  <text x="48" y="104" class="heading">Interact with the agent</text>
  <text x="48" y="142" class="body">Chat · Progress · Configuration</text>
  <text x="48" y="196" class="body">On the server or client machine</text>
  <text x="48" y="228" class="body">Web now · Desktop or other UI later</text>

  <rect x="24" y="336" width="380" height="244" rx="16" fill="#f0faf7" stroke="#bbddd2"/>
  <text x="48" y="374" class="label" fill="#18735e">RUNNER / TARGET MACHINE</text>
  <text x="48" y="416" class="heading">Client SDK + your tools</text>
  <text x="48" y="454" class="body">Receive · Execute · Return results</text>
  <text x="48" y="484" class="body">Coding tools or native device APIs</text>
  <text x="48" y="532" class="body">Workspace only when needed</text>
  <text x="48" y="560" class="body">Tool code stays on the device</text>

  <rect x="616" y="24" width="480" height="556" rx="16" fill="#f3f5ff" stroke="#cbd3f3"/>
  <text x="644" y="62" class="label" fill="#4763cb">AGENT HARNESS / YOUR SERVER</text>
  <rect x="644" y="88" width="424" height="136" rx="12" fill="#ffffff" stroke="#a7b5eb"/>
  <text x="668" y="130" class="heading">Model and agent loop</text>
  <text x="668" y="168" class="body">Reasoning · Context · Orchestration</text>
  <text x="668" y="198" class="body">One API for every frontend and runner</text>
  <rect x="644" y="252" width="424" height="136" rx="12" fill="#ffffff" stroke="#a7b5eb"/>
  <text x="668" y="294" class="heading">Server tools</text>
  <text x="668" y="332" class="body">Skills · Virtual files · Extensions</text>
  <text x="668" y="362" class="body">Execute in the server environment</text>
  <rect x="644" y="416" width="424" height="136" rx="12" fill="#e5eaff"/>
  <text x="668" y="458" class="heading">Database-backed state</text>
  <text x="668" y="496" class="body">Conversations · Events · Usage</text>
  <text x="668" y="526" class="body">Runner registration and dispatch</text>

  <text x="510" y="110" text-anchor="middle" class="flow">Chat / control</text>
  <path d="M 414 128 H 606" class="arrow"/>
  <path d="M 606 178 H 414" class="arrow"/>
  <text x="510" y="205" text-anchor="middle" class="flow">Events / state</text>
  <text x="510" y="410" text-anchor="middle" class="flow">Poll / results</text>
  <path d="M 414 428 H 606" class="arrow"/>
  <path d="M 606 486 H 414" class="arrow"/>
  <text x="510" y="514" text-anchor="middle" class="flow">Calls in response</text>

  <text x="560" y="619" text-anchor="middle" class="body">Frontend and runner connect to Harness APIs. No inbound endpoint is needed on the runner.</text>
</svg>
