<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="442" viewBox="0 0 1000 442" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">mainbot, Project sessions and the Runner</title>
  <desc id="desc">Chat with mainbot through the Console or Feishu. The Harness hosts both agent loops. mainbot tracks the goal, opens Project sessions and reviews their results. The Runner connects from the target machine and executes local tools.</desc>
  <defs>
    <style>
      text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#23354a}
      .head {font-size:24px;font-weight:700} .label {font-size:18px;font-weight:600} .body {font-size:17px}
      .flow {font-size:16px;fill:#405570} .line {stroke:#526484;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1000" height="442" rx="14" fill="#fff"/>
  <rect x="18" y="58" width="964" height="275" rx="16" fill="#f7f9fc" stroke="#b9c9da"/>
  <text x="950" y="84" text-anchor="end" class="label">Harness server</text>
  <text x="210" y="29" text-anchor="middle" class="label">Web Console · optional Feishu</text>
  <path d="M210 40V93" class="line"/>
  <path d="M205 45L210 37L215 45ZM205 88L210 96L215 88Z" fill="#526484"/>

  <rect x="42" y="98" width="348" height="147" rx="12" fill="#f4effc" stroke="#c6b4e3"/>
  <text x="63" y="132" class="head">mainbot</text>
  <text x="63" y="162" class="body">Your first personal Agent</text>
  <text x="63" y="192" class="body">Plan and track tasks</text>
  <text x="63" y="222" class="body">Review results and follow up</text>

  <path d="M397 148H601" class="line"/>
  <path d="M594 143L604 148L594 153Z" fill="#526484"/>
  <text x="500" y="135" text-anchor="middle" class="flow">Send work</text>
  <path d="M603 202H399" class="line"/>
  <path d="M406 197L396 202L406 207Z" fill="#526484"/>
  <text x="500" y="226" text-anchor="middle" class="flow">Return results</text>

  <rect x="610" y="98" width="348" height="147" rx="12" fill="#edf5ff" stroke="#abc7e8"/>
  <text x="630" y="132" class="head">Project sessions</text>
  <text x="630" y="162" class="body">A workspace and its selected tools</text>
  <text x="630" y="192" class="body">Investigate, implement and verify</text>
  <text x="630" y="222" class="body">Independent sessions can run in parallel</text>

  <text x="43" y="270" class="label">Shared by both layers</text>
  <text x="43" y="295" class="body">Model calls · Context · Server tools</text>
  <text x="43" y="319" class="body">Database-backed conversations and virtual files</text>
  <path d="M721 251V350" class="line"/>
  <path d="M716 344L721 354L726 344Z" fill="#526484"/>
  <text x="711" y="291" text-anchor="end" class="flow">Tool calls</text>
  <path d="M842 350V251" class="line"/>
  <path d="M837 257L842 247L847 257Z" fill="#526484"/>
  <text x="854" y="291" class="flow">Results</text>
  <rect x="18" y="357" width="964" height="70" rx="12" fill="#eaf7f0" stroke="#a9cfb9"/>
  <text x="41" y="388" class="head">Runner on the target machine</text>
  <text x="42" y="413" class="body">Local files · Shell · Device APIs</text>
  <text x="955" y="399" text-anchor="end" class="body">Connects to the Harness over outbound HTTP</text>
</svg>
