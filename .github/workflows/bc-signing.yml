name: BC Signing

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bc-signing.yml'
      - 'jagent-harness-sdk/**'
      - 'pom.xml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bc-signing.yml'
      - 'jagent-harness-sdk/**'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  verify-bc-signing:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Verify release signing with bc
        run: mvn -B -f jagent-harness-sdk/pom.xml -P release verify
        env:
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
