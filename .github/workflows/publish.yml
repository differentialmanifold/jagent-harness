name: Publish Maven artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a release version matching the tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const version = readFileSync('pom.xml', 'utf8').match(/<version>([^<]+)<\/version>/)?.[1]
          assert(version && !version.includes('SNAPSHOT'), 'Set a release version before publishing')
          const ref = process.env.RELEASE_REF || ''
          if (ref.startsWith('refs/tags/')) assert.equal(ref, 'refs/tags/v' + version, 'Tag must match the Maven version')
          NODE
      - run: node --test skills/tests/*.test.mjs
      - run: mvn -B -Dharness.source.revision=${{ github.sha }} install
      - run: npm ci --prefix protocol && npm test --prefix protocol
      - run: npm ci --prefix console && npm test --prefix console && npm run build --prefix console
      - name: Test the matching Runner
        run: |
          npm ci --prefix sdk/node
          server=(examples/server-demo/target/server-demo-*.jar)
          JAGENT_TEST_SERVER_JAR="$PWD/${server[0]}" npm test --prefix sdk/node
      - name: Publish framework artifacts (examples excluded)
        run: mvn -B -pl jagent-api,jagent-harness-sdk/jagent-console-spring-boot-starter,jagent-harness-sdk/jagent-store-jdbc -am -P release -Dharness.source.revision=${{ github.sha }} deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - run: node scripts/package.mjs
      - name: Attach application, Harness JAR, Runner npm package, frontend and Agent skill to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp "target/jagent-$version.zip" release-assets/
          runner_version=$(node -p "require('./sdk/node/package.json').version")
          cp "target/jagent-$runner_version.tgz" release-assets/
          cp "examples/server-demo/target/server-demo-$version.jar" release-assets/
          (cd console/dist && zip -qr "../../release-assets/jagent-console-$version.zip" .)
          (cd skills && zip -qr "../release-assets/jagent-skill-$version.zip" jagent)
          (cd release-assets && sha256sum *.zip *.jar *.tgz > SHA256SUMS)
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/*
