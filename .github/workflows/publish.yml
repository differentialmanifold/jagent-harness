name: Publish SDK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: sh

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Import GPG signing key
        run: |
          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"
          echo "allow-loopback-pinentry" > "$HOME/.gnupg/gpg-agent.conf"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --batch --list-secret-keys --keyid-format LONG --with-colons | awk -F: '$1 == "sec" { print $5; exit }')"
          if [ -z "$key_id" ]; then
            echo "No GPG secret key was imported" >&2
            exit 1
          fi
          echo "MAVEN_GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Verify tag matches SDK version
        run: |
          version="$(mvn -q -f jagent-harness-sdk/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag v$tag does not match SDK version $version"
            exit 1
          fi

      - name: Publish SDK to Maven Central
        run: mvn -B -f jagent-harness-sdk/pom.xml -P release deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
