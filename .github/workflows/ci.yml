name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jagent
          POSTGRES_USER: jagent
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432/tcp
        options: --health-cmd "pg_isready -U jagent" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            protocol/package-lock.json
            sdk/node/package-lock.json
      - run: node --test scripts/lib/*.test.mjs && node scripts/start.mjs --help
      - run: node --test skills/tests/*.test.mjs
      - run: mvn -B install
      - run: npm ci --prefix sdk/node && npm test --prefix sdk/node
      - name: Verify packaged host with PostgreSQL on Linux
        env:
          JAGENT_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/jagent
          JAGENT_DATASOURCE_USERNAME: jagent
          JAGENT_DATASOURCE_PASSWORD: ci-only
          JAGENT_MODEL: ci
          JAGENT_OPENAI_BASE_URL: http://127.0.0.1:1/v1
          JAGENT_STATE_DIR: ${{ runner.temp }}/harness-state
        run: |
          node scripts/start.mjs harness --skip-build &
          launcher=$!
          trap 'kill "$launcher" 2>/dev/null || true; wait "$launcher" || true' EXIT
          curl -fsS --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:18181/api/v1/health
          test -s "$JAGENT_STATE_DIR/data/user.env"
          server=(server/target/jagent-server-*.jar)
          java -jar "${server[0]}" users create --name pg-ci --output "$RUNNER_TEMP/pg-user.env"
          java -jar "${server[0]}" users list | grep -F pg-ci
          test ! -e "$JAGENT_STATE_DIR/data/agent-server.db"
      - name: Install the packed npm CLI with an empty offline cache
        working-directory: sdk/node
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --global --prefix "$RUNNER_TEMP/client" --cache "$RUNNER_TEMP/empty-cache" --offline --no-audit "$RUNNER_TEMP"/jagent-*.tgz
          "$RUNNER_TEMP/client/bin/jagent" --help
          server=(../../server/target/jagent-server-*.jar)
          JAGENT_TEST_RUNNER_CLI="$RUNNER_TEMP/client/lib/node_modules/jagent/dist/cli.js" \
          JAGENT_TEST_SERVER_JAR="$(realpath "${server[0]}")" node --test test/harness.test.mjs
      - run: npm ci --prefix protocol && npm test --prefix protocol
      - run: npm ci --prefix console && npm test --prefix console && npm run build --prefix console
  coding-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix sdk/node
      - run: npm test --prefix sdk/node
      - run: node --test scripts/lib/local-shortcut.test.mjs
      - name: Install the Windows npm command
        working-directory: sdk/node
        shell: pwsh
        run: |
          npm pack --pack-destination $env:RUNNER_TEMP
          $archive = (Get-ChildItem "$env:RUNNER_TEMP/jagent-*.tgz").FullName
          npm install -g --offline --prefix "$env:RUNNER_TEMP/client" $archive
          & "$env:RUNNER_TEMP/client/jagent.cmd" --help
