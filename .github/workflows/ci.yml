name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            protocol/package-lock.json
      - run: node --check scripts/lib/launch.mjs && node scripts/dev.mjs --help
      - run: mvn -B install
      - run: npm ci --prefix protocol && npm test --prefix protocol
      - run: npm ci --prefix console && npm test --prefix console && npm run build --prefix console
  coding-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Windows launcher entry points
        shell: cmd
        run: |
          call scripts\dev.cmd --help
          if errorlevel 1 exit /b 1
          call scripts\start-server.cmd --help
          if errorlevel 1 exit /b 1
          call scripts\start-client.cmd --help
          if errorlevel 1 exit /b 1
          call scripts\start-frontend.cmd --help
          if errorlevel 1 exit /b 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - run: mvn -B -pl examples/coding-java -am test
